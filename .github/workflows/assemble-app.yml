name: Assemble app.js
on:
  push:
    branches: [main]
    paths: ['.github/workflows/assemble-app.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts into app.js
        run: |
          cat app.part1.js app.part2.js app.part3.js app.part4.js app.part5.js > app.js
          echo "20b66138ec40aa18986b981ae7a222d1  app.js" | md5sum -c -
          git rm -q app.part1.js app.part2.js app.part3.js app.part4.js app.part5.js .github/workflows/assemble-app.yml
          git add app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Assemble app.js from parts (byte-identical)"
          git push
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
